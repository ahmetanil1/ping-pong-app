name: Ping-Pong CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".dockerignore"
      - ".env*"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".dockerignore"
      - ".env*"

jobs:
  # ==========================================
  test-services:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ping-service, pong-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.24.6
          cache: true

      - name: Run go unit tests
        run: |
          cd ${{ matrix.service }}
          go test -v ./...

  # ==========================================
  lint-helm:
    name: Lint Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm CLI
        uses: azure/setup-helm@v3
        with:
          version: v3.17.0

      - name: Lint Helm Charts
        run: |
          helm lint deployments/helm/ping-pong-charts
  # ==========================================
  security-scan:
    name: Native Security & CodeQL Scan
    needs: [test-services] # Testler biter bitmez çalışır (PR ve Push'ta aktiftir)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Dependency Review (PR Check)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
  # ==========================================
  build-and-push:
    name: Build and Push (${{ matrix.service }})
    needs: [test-services, lint-helm, security-scan] # Güvenlik taraması da geçerse çalışır
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    strategy:
      matrix:
        service: [ping-service, pong-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      
      - name: Build and Push Docker Images
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
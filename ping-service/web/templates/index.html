<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ping-Pong Microservice Dashboard</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        margin: 0;
        padding: 40px;
        display: flex;
        justify-content: center;
      }
      .card {
        background-color: #1e293b;
        border-radius: 12px;
        padding: 32px;
        width: 100%;
        max-width: 600px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        border: 1px solid #334155;
      }
      h1 {
        margin-top: 0;
        color: #38bdf8;
        font-size: 24px;
        border-bottom: 2px solid #334155;
        padding-bottom: 12px;
      }
      .status-box {
        background-color: #0f172a;
        border-radius: 8px;
        padding: 16px;
        margin: 20px 0;
        border-left: 4px solid #38bdf8;
        font-family: monospace;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .btn {
        background-color: #0284c7;
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
        width: 100%;
      }
      .btn:hover {
        background-color: #0369a1;
      }
      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
      }
      .badge-success {
        background-color: #059669;
        color: white;
      }
      .badge-error {
        background-color: #dc2626;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🏓 Microservice Control Panel</h1>
      <p>
        <strong>Architecture:</strong> ping-service ➔ pong-service ➔ PostgreSQL
        & Redis
      </p>

      <button class="btn" onclick="triggerPing()">PING GÖNDER</button>

      <h3>Son İşlem Durumu:</h3>
      <div id="status" class="status-box">
        Henüz bir istek atılmadı. Butona tıklayın.
      </div>

      <div style="margin-top: 20px; font-size: 13px; color: #94a3b8">
        <span>System Status: </span>
        <span id="system-badge" class="badge badge-success">READY</span>
      </div>
    </div>

    <script>
      async function triggerPing() {
        const statusBox = document.getElementById("status");
        const badge = document.getElementById("system-badge");
        statusBox.innerText = "İstek gönderiliyor...";

        try {
          const response = await fetch("/api/v1/ping");
          const data = await response.json();

          statusBox.innerText = JSON.stringify(data, null, 2);
          if (data.success) {
            badge.className = "badge badge-success";
            badge.innerText = "SUCCESS (200 OK)";
          } else {
            badge.className = "badge badge-error";
            badge.innerText = "ERROR";
          }
        } catch (err) {
          statusBox.innerText = "Hata oluştu: " + err.message;
          badge.className = "badge badge-error";
          badge.innerText = "CONNECTION ERROR";
        }
      }
    </script>
  </body>
</html>

nameSuffix: pong
componentLabel: pong-service
serviceResourceName: pong-service   

replicaCount: 2
image:
  repository: pong-service
  tag: latest
  # Never => The image will not be pulled from the registry, it will use the local image if available.
  pullPolicy: Never
service:
  type: ClusterIP
  port: 8081
  targetPort: 8081
  name: http
resources:
  requests:
    cpu: "20m"
    memory: "32Mi"
  limits:
    cpu: "100m"
    memory: "128Mi"
hpa:
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
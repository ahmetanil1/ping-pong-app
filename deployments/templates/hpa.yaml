{{- range $key := list "ping-service" "pong-service" }}
{{- $v := index $.Values $key }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "hepapi-case.fullname" $ }}-{{ $v.nameSuffix }}-hpa
  labels:
    {{- include "hepapi-case.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $v.componentLabel }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "hepapi-case.fullname" $ }}-{{ $v.nameSuffix }}-deployment
  minReplicas: {{ $v.hpa.minReplicas }}
  maxReplicas: {{ $v.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $v.hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hepapi-case.fullname" . }}-ingress
  labels:
    {{- include "hepapi-case.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
  {{- if .Values.ingress.annotations }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  {{- range .Values.ingress.hosts }}
    - {{- if .host }}
      host: {{ .host | quote }}
      {{- end }}
      http:
        paths:
        {{- range .paths }}
          {{- $targetServiceName := .targetService }}
          {{- $targetServiceValues := index $.Values $targetServiceName }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            # The backend service that will handle the requests matching the path. (ping-service)
            backend:
              service:
                name: {{ include "hepapi-case.fullname" $ }}-{{ $targetServiceValues.serviceResourceName }}
                port:
                  number: {{ $targetServiceValues.service.port }}
        {{- end }}
  {{- end }}
{{- end }}
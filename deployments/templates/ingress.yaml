{{- $pingValues := index .Values "ping-service" }}
{{- if $pingValues.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hepapi-case.fullname" . }}-{{ $pingValues.serviceResourceName }}-ingress
  labels:
    {{- include "hepapi-case.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $pingValues.componentLabel }}
  {{- if $pingValues.ingress.annotations }}
  annotations:
    {{- toYaml $pingValues.ingress.annotations | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $pingValues.ingress.className }}
  rules:
  {{- range $pingValues.ingress.hosts }}
    - {{- if .host }}
      host: {{ .host | quote }}
      {{- end }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              # The backend service that will handle the requests matching the path. (ping-service)
              service:
                name: {{ include "hepapi-case.fullname" $ }}-{{ $pingValues.serviceResourceName }}
                port:
                  number: {{ $pingValues.service.port }}
        {{- end }}
  {{- end }}
{{- end }}
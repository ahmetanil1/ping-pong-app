global: 
  nodeSelectors:
    application: "application"
    database: "database"

--- 
redis:
  enabled: true
  replicaCount: 1
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379
  resources:
    requests:
      cpu: "10m"
      memory: "16Mi"
    limits:
      cpu: "50m"
      memory: "64Mi"
  probes:
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

---
postgres:
  enabled: true
  replicaCount: 1
  image:
    repository: postgres
    tag: 15-alpine
    pullPolicy: IfNotPresent
  config:
    user: "postgres"
    db: "pingpongdb"
    port: 5432
  secret:
    password: "postgres"
  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
  persistence:
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 2Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"
  probes:
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

pongService:
  enabled: true
  replicaCount: 2
  image:
    repository: pong-service
    tag: latest
    pullPolicy: Never 
  port: 8081
  service:
    type: ClusterIP
    port: 8081
    targetPort: 8081
  resources:
    requests:
      cpu: "20m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532


pingService:
  enabled: true
  replicaCount: 2
  image:
    repository: ping-service
    tag: latest
    pullPolicy: Never 
  port: 8080
  service:
    type: NodePort
    port: 8080
    targetPort: 8080
    nodePort: 30080
  resources:
    requests:
      cpu: "20m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
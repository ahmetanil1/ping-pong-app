apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hepapi-case.fullname" . }}-redis-deployment
  labels:
    {{- include "hepapi-case.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: {{ .Values.redis.replicaCount }}
  selector:
    matchLabels:
      {{- include "hepapi-case.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "hepapi-case.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      {{- if .Values.global.nodeSelectors.application }}
      nodeSelector:
        workload: {{ .Values.global.nodeSelectors.application | quote }}
      {{- end }}
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.redis.service.port }}
              name: redis
          env:
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "hepapi-case.fullname" . }}-redis-config
                  key: REDIS_PORT
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 2 # Wait 2 seconds before starting health checks
            periodSeconds: 3 # Test redis connection every 3 seconds
            timeoutSeconds: 1 # Wait 1 second for the test to complete
            failureThreshold: 3 # Retry 3 times before considering the container unhealthy
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pong-service-deployment
spec:
  # Resources managed by HPA, so we don't set replicas here. HPA will manage the number of replicas based on CPU utilization.
  # Identifying the replica might be helpful, but it could create race conditions.
  # replicas: 2
  selector:
    matchLabels:
      app: pong-service
  template:
    metadata:
      labels:
        app: pong-service
    spec:
      # Security context is set to run the container as a non-root user with a specific user ID (65532). 
      # This enhances security by preventing the container from running with root privileges.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      nodeSelector:
        workload: application
      containers:
        - name: pong-service
          image: pong-service:latest
          # non-root user is used to run the container (same as the Dockerfile)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # Image pull policy is set to "Never" to ensure that the local Docker image is used in Minikube.
          # This is useful for development and testing purposes, as it allows you to use the latest local build of the pong-service without pulling from a remote registry.
          imagePullPolicy: Never 
          env:
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PONG_SERVICE_PORT
              valueFrom: 
                configMapKeyRef:
                  name: pong-service-config
                  key: PONG_SERVICE_PORT
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"

          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

          livenessProbe:
            httpGet:
              path: /healthz/liveness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
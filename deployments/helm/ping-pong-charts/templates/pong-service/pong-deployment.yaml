apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hepapi-case.fullname" . }}-pong-deployment
  labels:
    {{- include "hepapi-case.labels" . | nindent 4 }}
    app.kubernetes.io/component: pong-service
spec:
  # Resources managed by HPA, so we don't set replicas here. HPA will manage the number of replicas based on CPU utilization.
  # Identifying the replica might be helpful, but it could create race conditions.
  # replicas: {{ .Values.pongService.replicaCount }}
  selector:
    matchLabels:
      {{- include "hepapi-case.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pong-service
  template:
    metadata:
      labels:
        {{- include "hepapi-case.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pong-service
    spec:
      # Graceful shutdown period: Provides up to 30 seconds for the pod to terminate cleanly 
      # before Kubernetes forcibly kills the container with SIGKILL.
      terminationGracePeriodSeconds: 30
      # Security context is set to run the container as a non-root user with a specific user ID (65532). 
      # This enhances security by preventing the container from running with root privileges.
      securityContext:
        runAsNonRoot: {{ .Values.pongService.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.pongService.securityContext.runAsUser }}
      {{- if .Values.global.nodeSelectors.application }}
      nodeSelector:
        workload: {{ .Values.global.nodeSelectors.application | quote }}
      {{- end }}
      containers:
        - name: pong-service
          image: "{{ .Values.pongService.image.repository }}:{{ .Values.pongService.image.tag }}"
          # Image pull policy is set to "Never" to ensure that the local Docker image is used in Minikube.
          # This is useful for development and testing purposes, as it allows you to use the latest local build of the pong-service without pulling from a remote registry.
          imagePullPolicy: {{ .Values.pongService.image.pullPolicy }}
          # Pre-stop hook: Pauses container termination for 5 seconds to allow Kubernetes DNS 
          # and Ingress/Service endpoints to update, ensuring zero-downtime during rolling updates.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          # non-root user is used to run the container (same as the Dockerfile)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: {{ .Values.pongService.service.port }}
              name: http
          env:
            - name: DB_HOST
              value: {{ include "hepapi-case.fullname" . }}-postgres
            - name: DB_PORT
              value: {{ .Values.postgres.config.port | quote }}
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "hepapi-case.fullname" . }}-postgres-config
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "hepapi-case.fullname" . }}-postgres-config
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hepapi-case.fullname" . }}-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PONG_SERVICE_PORT
              valueFrom: 
                configMapKeyRef:
                  name: {{ include "hepapi-case.fullname" . }}-pong-config
                  key: PONG_SERVICE_PORT
            - name: REDIS_HOST
              value: {{ include "hepapi-case.fullname" . }}-redis-cache
            - name: REDIS_PORT
              value: {{ .Values.redis.service.port | quote }}
          resources:
            {{- toYaml .Values.pongService.resources | nindent 12 }}
          # Liveness probe is configured to check the health of the pong-service application and restart the container if it becomes unresponsive.
          livenessProbe:
            httpGet:
              path: /healthz/liveness
              port: {{ .Values.pongService.service.port }}
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 3
          # Readiness probe is configured to check the health of the pong-service application before it starts receiving traffic.
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: {{ .Values.pongService.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
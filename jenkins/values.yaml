controller:
  numExecutors: 0

  serviceType: ClusterIP
  agentListenerServiceType: ClusterIP

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  podSecurityContextOverride:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  # The following init container is used to fix the permissions of the Jenkins home directory.
  # firstly, starts container as root user, then changes the ownership of the Jenkins home directory to the Jenkins user (UID 1000) and group (GID 1000).
  customInitContainers:
    - name: fix-jenkins-home-permissions
      image: busybox:1.36.1
      command: ["sh", "-c", "chown -R 1000:1000 /var/jenkins_home"]
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      volumeMounts:
        - name: jenkins-home
          mountPath: /var/jenkins_home

  # it's necessary to use the withCredentials step in the pipeline
  additionalPlugins:
    - credentials-binding

  additionalExistingSecrets:
    - name: dockerhub-credentials
      keyName: dockerhub-username
    - name: dockerhub-credentials
      keyName: dockerhub-token

persistence:
  enabled: true
  storageClass: null
  accessMode: ReadWriteOnce
  size: 4Gi

rbac:
  create: true
  readSecrets: false

serviceAccount:
  create: true
  name: jenkins-controller

serviceAccountAgent:
  create: true
  name: jenkins-agent

agent:
  enabled: true
  useDefaultServiceAccount: true
